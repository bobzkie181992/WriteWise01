<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B32" />
      <stop offset="50%" stop-color="#17365D" />
      <stop offset="100%" stop-color="#1F8A8A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F4B942" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#gradBg)" />
  
  <!-- Outer glowing accent ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Inner Book / Scaffolder Icon -->
  <g filter="url(#shadow)" transform="translate(106, 116)">
    <!-- Open Book Pages -->
    <path d="M150 250 C150 250 90 220 20 220 L20 40 C90 40 150 70 150 70 C150 70 210 40 280 40 L280 220 C210 220 150 250 150 250 Z" 
          fill="#FFFFFF" />
    
    <!-- Spine Divider & Central Quill Accent -->
    <path d="M150 70 L150 250" stroke="#17365D" stroke-width="6" stroke-linecap="round" />
    
    <!-- Left lines -->
    <line x1="45" y1="90" x2="125" y2="105" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
    <line x1="45" y1="125" x2="125" y2="140" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
    <line x1="45" y1="160" x2="105" y2="175" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
    
    <!-- Right lines (Tiered Gold Highlights) -->
    <line x1="175" y1="105" x2="255" y2="90" stroke="#F4B942" stroke-width="5" stroke-linecap="round" />
    <line x1="175" y1="140" x2="255" y2="125" stroke="#1F8A8A" stroke-width="5" stroke-linecap="round" />
    <line x1="175" y1="175" x2="235" y2="160" stroke="#17365D" stroke-width="5" stroke-linecap="round" />
    
    <!-- Academic Quill Sparkle -->
    <circle cx="230" cy="50" r="16" fill="url(#goldGrad)" />
    <polygon points="230,24 235,45 256,50 235,55 230,76 225,55 204,50 225,45" fill="#FFFFFF" />
  </g>
  
  <!-- App Acronym Subtitle -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" letter-spacing="6">WRITEWISE</text>
</svg>
